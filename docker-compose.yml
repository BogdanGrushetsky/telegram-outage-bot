version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: power-outage-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MONGODB_URI: ${MONGODB_URI}
      API_PORT: ${API_PORT:-3000}
      SCHEDULE_UPDATE_INTERVAL: ${SCHEDULE_UPDATE_INTERVAL:-900000}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${API_PORT:-3000}/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
